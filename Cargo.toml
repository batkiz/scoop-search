[package]
name = "scoop-search"
version = "0.7.0"
authors = ["tokiedokie <42903136+tokiedokie@users.noreply.github.com>"]
edition = "2018"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true
panic = 'abort'

[dependencies]
ureq = { version = "1.4", features = ["json"] }
serde_json = "1.0"
strsim = "0.11.1"
# Use the same Unicode codepoint/lowercase handling as our literal/typo search.
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
