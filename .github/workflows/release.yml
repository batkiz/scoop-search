name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Verify version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'scoop-search').version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag and Cargo version do not match" }
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Windows x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Prepare assets
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/scoop-search.exe dist/scoop-search.exe
          $hash = (Get-FileHash dist/scoop-search.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  scoop-search.exe" | Set-Content -Encoding ascii dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', $env:RELEASE_TAG)
          if (Test-Path $notes) { $releaseArgs += @('--notes-file', $notes) }
          else { $releaseArgs += '--generate-notes' }
          $releaseArgs += @('dist/scoop-search.exe', 'dist/SHA256SUMS')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
